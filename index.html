const D=[];RAW.forEach((s,i)=>{const c=[];s.slice(2).forEach((l,j)=>{const a=l.split("|");const o={id:i+"-"+j,de:a[0],tr:a[1],ex:a[2],et:a[3],c:s[1]};c.push(o);D.push(o)});s.cards=c});
let P={};try{P=JSON.parse(localStorage.getItem("wk")||"{}")}catch(e){}
const save=()=>{try{localStorage.setItem("wk",JSON.stringify(P))}catch(e){}};
const $=i=>document.getElementById(i);let rev=false,queue=[],cur=0,shown=false,hist=[];
const DAY=864e5,GAP=[0,1,3,7,14,30];
const due=c=>P[c.id]&&P[c.id].d<=Date.now();
function stats(){const st=D.filter(c=>P[c.id]).length,ln=D.filter(c=>P[c.id]&&P[c.id].b>=3).length;
$("n1").textContent=D.length;$("n2").textContent=st;$("n3").textContent=Math.round(ln/D.length*100)+"%";$("n4").textContent=D.filter(due).length;$("pg").style.width=(ln/D.length*100)+"%"}
let G=20,GR=[],GS=[],curK=null,SH=false;try{SH=localStorage.getItem("wksh")=="1"}catch(e){}try{G=+(localStorage.getItem("wkg")||20)}catch(e){}
function render(){const q=$("q").value.toLowerCase().trim();let h="";GR=[];GS=[];
RAW.forEach((s,i)=>{const all=s.cards;const cs=q?all.filter(c=>(c.de+" "+c.tr).toLowerCase().includes(q)):all;if(!cs.length)return;
const L=a=>a.filter(c=>P[c.id]&&P[c.id].b>=3).length;
h+=`<h2>${s[0]} <small class="tot">${all.length} kart · ${L(all)} öğrenildi</small></h2><div class="grid">`;
const btn=(t,arr,sub)=>{GR.push(arr);GS.push(i);const l=L(arr);return `<button class="sec" style="--c:${s[1]}" data-k="${GR.length-1}"><b>${t}</b><small>${sub||""}${arr.length} kart · ${l} öğrenildi</small><div class="pb"><i style="width:${l/arr.length*100}%"></i></div></button>`};
if(q){h+=btn("Arama sonuçları",cs)}else{
for(let a=0;a<all.length;a+=G){const g=all.slice(a,a+G);h+=btn("Grup "+(a/G+1),g,(a+1)+"–"+(a+g.length)+" · ")}}
h+="</div>";
});$("list").innerHTML=h||"<p class='s'>Sonuç yok.</p>";
document.querySelectorAll(".sec").forEach(b=>b.onclick=()=>start(GR[b.dataset.k],+b.dataset.k));
$("g20").classList.toggle("on",G==20);$("g30").classList.toggle("on",G==30);stats()}
function start(a,k){if(!a.length){alert("Bu filtrede kart yok.");return}curK=(k===undefined?null:k);queue=[...a];if(SH)queue.sort(()=>Math.random()-.5);cur=0;shown=false;hist=[];$("study").classList.add("open");draw()}
function draw(){if(cur>=queue.length){$("study").classList.remove("open");const k=curK;render();if(k!==null&&GR[k+1]&&GS[k+1]===GS[k]&&confirm("Grup tamamlandı. Sonraki gruba geçelim mi?"))start(GR[k+1],k+1);return}
const c=queue[cur];$("cnt").textContent=(cur+1)+" / "+queue.length;$("star").textContent=P[c.id]&&P[c.id].s?"★":"☆";
const f=$("fc");f.style.setProperty("--c",c.c);
const front=rev?`<div class="w" style="color:#1b7a57">${c.tr}</div><div class="m">dokun → Almanca</div>`:`<div class="w">${c.de}</div><div class="m">dokun → anlam</div>`;
const back=`<div class="w">${c.de}</div><div class="t">${c.tr}</div><div class="e">${c.ex}</div><div class="m">${c.et}</div>`;
f.innerHTML=shown?back:front;$("bk").disabled=!hist.length;$("bk").style.opacity=hist.length?1:.4}
function snap(){const c=queue[cur];hist.push({q:[...queue],cur:cur,id:c.id,prev:P[c.id]?JSON.stringify(P[c.id]):null})}
function grade(k){snap();const c=queue[cur],p=P[c.id]||{b:0,s:0};if(!k)queue.push(c);p.b=k?Math.min(5,p.b+1):0;p.d=Date.now()+GAP[p.b]*DAY;P[c.id]=p;save();cur++;shown=false;draw()}
$("bk").onclick=()=>{const h=hist.pop();if(!h)return;queue=h.q;cur=h.cur;if(h.prev===null)delete P[h.id];else P[h.id]=JSON.parse(h.prev);save();shown=false;draw()};$("sk").onclick=()=>{snap();queue.push(queue.splice(cur,1)[0]);shown=false;draw()};
$("fc").onclick=()=>{shown=!shown;draw()};$("ok").onclick=()=>grade(1);$("no").onclick=()=>grade(0);$("x").onclick=()=>{$("study").classList.remove("open");render()};
$("star").onclick=()=>{const c=queue[cur],p=P[c.id]||{b:0,d:Date.now()+DAY};p.s=p.s?0:1;P[c.id]=p;save();draw()};
$("bDue").onclick=()=>start(D.filter(c=>due(c)||!P[c.id]).slice(0,G));
$("bStar").onclick=()=>start(D.filter(c=>P[c.id]&&P[c.id].s));
$("bNew").onclick=()=>start(D.filter(c=>!P[c.id]).slice(0,G));
$("bRnd").onclick=()=>start([...D].sort(()=>Math.random()-.5).slice(0,20));
$("bRev").onclick=e=>{rev=!rev;e.target.textContent="Ters yön: "+(rev?"açık":"kapalı");e.target.classList.toggle("on",rev)};
$("bReset").onclick=()=>{if(confirm("Tüm ilerleme silinsin mi?")){P={};save();render()}};
$("g20").onclick=()=>{G=20;try{localStorage.setItem("wkg","20")}catch(e){}render()};$("g30").onclick=()=>{G=30;try{localStorage.setItem("wkg","30")}catch(e){}render()};

function showIO(t,p,txt,apply){$("iot").textContent=t;$("iop").textContent=p;$("iota").value=txt;$("ioapply").style.display=apply?"":"none";$("iocopy").style.display=apply?"none":"";$("io").style.display="flex";$("iota").readOnly=!apply}
$("bShuf").onclick=()=>{SH=!SH;try{localStorage.setItem("wksh",SH?"1":"0")}catch(e){}$("bShuf").textContent="Grup içi karıştır: "+(SH?"açık":"kapalı");$("bShuf").classList.toggle("on",SH)};
$("bShuf").textContent="Grup içi karıştır: "+(SH?"açık":"kapalı");$("bShuf").classList.toggle("on",SH);
$("bExp").onclick=()=>showIO("İlerlemeyi dışa aktar","Metni kopyalayıp bir yere (not uygulaması, e-posta) kaydet. Başka cihazda İçe aktar ile geri yükleyebilirsin.",JSON.stringify({v:1,P:P,G:G,SH:SH}),false);
$("bImp").onclick=()=>showIO("İlerlemeyi içe aktar","Daha önce dışa aktardığın metni buraya yapıştır, sonra Uygula'ya bas. Mevcut ilerleme değiştirilir.","",true);
$("iocopy").onclick=async()=>{const t=$("iota").value;try{await navigator.clipboard.writeText(t);$("iocopy").textContent="Kopyalandı ✓"}catch(e){$("iota").focus();$("iota").select();try{document.execCommand("copy");$("iocopy").textContent="Kopyalandı ✓"}catch(e2){$("iocopy").textContent="Metni elle kopyala"}}setTimeout(()=>$("iocopy").textContent="Kopyala",2000)};
$("ioapply").onclick=()=>{try{const o=JSON.parse($("iota").value.trim());if(!o||typeof o.P!=="object")throw 0;const ids=new Set(D.map(c=>c.id));const np={};let n=0;for(const k in o.P){if(ids.has(k)&&o.P[k]&&typeof o.P[k].b==="number"){np[k]=o.P[k];n++}}if(!confirm(n+" kartın ilerlemesi içe aktarılsın mı? Mevcut ilerleme değişecek."))return;P=np;save();$("io").style.display="none";render()}catch(e){alert("Metin geçerli değil. Dışa aktarılan metnin tamamını yapıştır.")}};
$("ioclose").onclick=()=>{$("io").style.display="none"};

function fsMsg(){alert("Bu cihazda ya da bu görünümde tam ekran kullanılamıyor. Sayfayı tarayıcıda ayrı sekmede açmayı dene (artifact'ın Paylaş/Aç seçeneği) ya da cihazın kendi tam ekran özelliğini kullan.")}
function toggleFS(){const d=document,el=d.documentElement;const on=d.fullscreenElement||d.webkitFullscreenElement;try{if(on){(d.exitFullscreen||d.webkitExitFullscreen).call(d)}else{const f=el.requestFullscreen||el.webkitRequestFullscreen;if(!f)throw 0;const pr=f.call(el);if(pr&&pr.catch)pr.catch(fsMsg)}}catch(e){fsMsg()}}
function fsLabel(){const on=document.fullscreenElement||document.webkitFullscreenElement;document.querySelectorAll(".fsb").forEach(b=>b.textContent=on?"⤢ Tam ekrandan çık":"⛶ Tam ekran")}
$("bFs").onclick=toggleFS;$("fsS").onclick=toggleFS;document.addEventListener("fullscreenchange",fsLabel);document.addEventListener("webkitfullscreenchange",fsLabel);
$("q").oninput=render;render();
</script></body></html>
